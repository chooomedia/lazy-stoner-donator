name: Validate and deploy

on:
  pull_request:
    branches:
      - lazy-stoner-donator
  push:
    branches:
      - lazy-stoner-donator
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate runtime files, SEO assets and data sync
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          SOCIAL_IMAGE_HOSTS = {"social-wish", "campaign-wish", "donation-wish"}
          REQUIRED_FILES = [
              "index.html",
              "en/index.html",
              "robots.txt",
              "llms.txt",
              "sitemap.xml",
              "wishlist-products.json",
              "wishlist-products.en.json",
              "wishlist-content.json",
              "wishlist-content.en.json",
              "styles/main.css",
              "js/adCard.js",
              "js/card.js",
              "js/cardStack.js",
              "js/http.js",
              "js/widget.js",
              "js/wishlistUi.js",
              "js/wishlistApp.js",
              "js/logoMarquee.js",
              "js/wishlistProductsData.js",
              "js/wishlistProductsData.en.js",
              "js/wishlistContentData.js",
              "js/wishlistContentData.en.js",
              "favicon.ico",
              "favicon.svg",
              "favicon.png",
              "favicon-16x16.png",
              "favicon-32x32.png",
              "favicon-48x48.png",
              "apple-touch-icon.png",
              "icon-192.png",
              "icon-512.png",
              "icon-maskable-512.png",
              "site.webmanifest",
              "site.en.webmanifest",
              "assets/fonts/comfortaa/comfortaa-latin-ext-300.woff2",
              "assets/fonts/comfortaa/comfortaa-latin-ext-400.woff2",
              "assets/fonts/comfortaa/comfortaa-latin-ext-500.woff2",
              "assets/fonts/comfortaa/comfortaa-latin-ext-600.woff2",
              "assets/fonts/comfortaa/comfortaa-latin-ext-700.woff2",
              "assets/vendor/fontawesome/webfonts/fa-solid-900.woff2",
              "assets/vendor/fontawesome/webfonts/fa-brands-400.woff2",
              "assets/social/lazy-stoner-donator-og.png",
          ]
          REQUIRED_DIRECTORIES = ["assets", "js", "styles"]

          def fail(message):
              raise SystemExit(f"validation failed: {message}")

          def read_json(relative_path):
              with (ROOT / relative_path).open("r", encoding="utf-8") as handle:
                  return json.load(handle)

          def read_fallback_assignment(relative_path, variable_name):
              source = (ROOT / relative_path).read_text(encoding="utf-8")
              match = re.search(rf"window\.{re.escape(variable_name)}\s*=\s*(.*?);\s*$", source, re.DOTALL)
              if not match:
                  fail(f"{relative_path} does not assign window.{variable_name}")
              return json.loads(match.group(1))

          def read_json_ld(index_html):
              match = re.search(r'<script[^>]+id="wishlist-schema"[^>]*>\s*(.*?)\s*</script>', index_html, re.DOTALL)
              if not match:
                  fail("index.html does not contain wishlist-schema JSON-LD")
              return json.loads(match.group(1))

          def find_schema_node(schema, node_type):
              for node in schema.get("@graph", [schema]):
                  if isinstance(node, dict) and node.get("@type") == node_type:
                      return node
              fail(f"JSON-LD @graph is missing a {node_type} node")

          def resolve_breadcrumb(json_ld, web_page):
              breadcrumb = web_page.get("breadcrumb")
              if isinstance(breadcrumb, dict) and "@id" in breadcrumb:
                  wanted = breadcrumb["@id"]
                  for node in json_ld.get("@graph", []):
                      if isinstance(node, dict) and node.get("@id") == wanted:
                          return node
                  fail(f"JSON-LD @graph has no BreadcrumbList node with @id {wanted}")
              fail("WebPage node is missing a breadcrumb reference")

          for relative_path in REQUIRED_FILES:
              if not (ROOT / relative_path).is_file():
                  fail(f"missing required file: {relative_path}")

          for relative_path in REQUIRED_DIRECTORIES:
              if not (ROOT / relative_path).is_dir():
                  fail(f"missing required directory: {relative_path}")

          index_html = (ROOT / "index.html").read_text(encoding="utf-8")
          en_html = (ROOT / "en/index.html").read_text(encoding="utf-8")
          expected_meta = [
              'property="og:image" content="https://lsd.cannachris.de/assets/social/lazy-stoner-donator-og.png"',
              'property="og:image:width" content="1200"',
              'property="og:image:height" content="630"',
              'name="twitter:card" content="summary_large_image"',
              'favicon.ico" sizes="any"',
              'favicon.svg" type="image/svg+xml"',
              'apple-touch-icon.png"',
              '.webmanifest',
              'hreflang="de"',
              'hreflang="en"',
              'hreflang="x-default"',
              'class="language-switcher"',
              'wishlistUi.js"',
              'wishlistApp.js"',
              'logoMarquee.js"',
              "JSON-LD:BEGIN",
              "JSON-LD:END",
          ]
          for snippet in expected_meta:
              if snippet not in index_html:
                  fail(f"index.html is missing meta/link snippet: {snippet}")
              if snippet not in en_html:
                  fail(f"en/index.html is missing meta/link snippet: {snippet}")

          if 'lang="en"' not in en_html:
              fail("en/index.html must use lang=en")
          if 'rel="canonical" href="https://lsd.cannachris.de/en/"' not in en_html:
              fail("en/index.html must canonicalize to /en/")
          if 'rel="canonical" href="https://lsd.cannachris.de/"' not in index_html:
              fail("index.html must canonicalize to /")

          products = read_json("wishlist-products.json")
          products_en = read_json("wishlist-products.en.json")
          content = read_json("wishlist-content.json")
          content_en = read_json("wishlist-content.en.json")
          fallback_products = read_fallback_assignment("js/wishlistProductsData.js", "birthdayWishlistProducts")
          fallback_products_en = read_fallback_assignment("js/wishlistProductsData.en.js", "birthdayWishlistProductsEn")
          fallback_content = read_fallback_assignment("js/wishlistContentData.js", "birthdayWishlistContent")
          fallback_content_en = read_fallback_assignment("js/wishlistContentData.en.js", "birthdayWishlistContentEn")
          json_ld = read_json_ld(index_html)
          en_json_ld = read_json_ld(en_html)
          web_page = find_schema_node(json_ld, "WebPage")
          web_page_en = find_schema_node(en_json_ld, "WebPage")
          organization = find_schema_node(json_ld, "Organization")
          breadcrumb = resolve_breadcrumb(json_ld, web_page)
          breadcrumb_en = resolve_breadcrumb(en_json_ld, web_page_en)
          if find_schema_node(en_json_ld, "Organization") != organization:
              fail("en/index.html Organization node must match index.html")
          if find_schema_node(json_ld, "WebSite").get("name") != "Lazy Stoner Donator":
              fail("WebSite node name must match og:site_name")

          logo = organization.get("logo", {})
          if not str(logo.get("url", "")).endswith("/icon-192.png"):
              fail("Organization logo must reference icon-192.png")
          if logo.get("width") != 192 or logo.get("height") != 192:
              fail("Organization logo must declare 192x192 dimensions")

          if len(breadcrumb.get("itemListElement", [])) < 2:
              fail("de BreadcrumbList must contain at least 2 items")
          if len(breadcrumb_en.get("itemListElement", [])) < 2:
              fail("en BreadcrumbList must contain at least 2 items")
          last_crumb = breadcrumb["itemListElement"][-1].get("item", "")
          last_crumb_en = breadcrumb_en["itemListElement"][-1].get("item", "")
          if last_crumb != "https://lsd.cannachris.de/":
              fail("de BreadcrumbList last item must be the canonical de URL")
          if last_crumb_en != "https://lsd.cannachris.de/en/":
              fail("en BreadcrumbList last item must be the canonical en URL")

          if products != fallback_products:
              fail("product JSON and fallback product JS differ")

          if products_en != fallback_products_en:
              fail("English product JSON and fallback product JS differ")

          if content != fallback_content:
              fail("content JSON and fallback content JS differ")

          if content_en != fallback_content_en:
              fail("English content JSON and fallback content JS differ")

          for required_key in ("seo", "i18n", "a11y", "hero", "wishlist", "card", "footer"):
              if required_key not in content:
                  fail(f"wishlist-content.json missing key: {required_key}")
              if required_key not in content_en:
                  fail(f"wishlist-content.en.json missing key: {required_key}")

          if content.get("locale") != "de" or content_en.get("locale") != "en":
              fail("locale fields must be de/en")

          sitemap = (ROOT / "sitemap.xml").read_text(encoding="utf-8")
          for snippet in (
              "https://lsd.cannachris.de/en/",
              'hreflang="de"',
              'hreflang="en"',
              'hreflang="x-default"',
              "wishlist-content.en.json",
          ):
              if snippet not in sitemap:
                  fail(f"sitemap.xml missing: {snippet}")

          json_ld_items = web_page.get("mainEntity", {}).get("itemListElement", [])
          if web_page.get("mainEntity", {}).get("numberOfItems") != len(products):
              fail("JSON-LD numberOfItems does not match wishlist-products.json")

          if len(json_ld_items) != len(products):
              fail("JSON-LD itemListElement count does not match wishlist-products.json")

          if not web_page.get("primaryImageOfPage", {}).get("url", "").endswith("/assets/social/lazy-stoner-donator-og.png"):
              fail("JSON-LD primaryImageOfPage does not reference the OG image")

          if re.search(r'"@type"\s*:\s*"(Product|Offer)"', index_html):
              fail("wishlist overview must not expose incomplete Product or Offer rich-result markup")

          for index, product in enumerate(products, start=1):
              for field in ("adId", "title", "url", "image"):
                  if not product.get(field):
                      fail(f"product #{index} is missing required field: {field}")

              json_ld_item = json_ld_items[index - 1]
              if json_ld_item.get("position") != index:
                  fail(f"JSON-LD item position mismatch at product #{index}")

              if product.get("host") not in SOCIAL_IMAGE_HOSTS:
                  continue

              image = product.get("image", "")
              image_path = ROOT / image
              if not image.startswith("assets/images/social-wishes/"):
                  fail(f"social product #{index} image must live in assets/images/social-wishes")
              if image.endswith(".svg") or not image.endswith(".webp"):
                  fail(f"social product #{index} image must use WebP")
              if not image_path.is_file():
                  fail(f"social product #{index} image file does not exist: {image}")

              image_alt = product.get("imageAlt", "")
              if not isinstance(image_alt, str) or not (50 <= len(image_alt) <= 140):
                  fail(f"social product #{index} imageAlt must be 50-140 characters")

              image_title = product.get("imageTitle", "")
              if not isinstance(image_title, str) or not (25 <= len(image_title) <= 80):
                  fail(f"social product #{index} imageTitle must be 25-80 characters")

              image_keywords = product.get("imageKeywords")
              if not isinstance(image_keywords, list) or not (3 <= len(image_keywords) <= 8):
                  fail(f"social product #{index} imageKeywords must contain 3-8 strings")
              if not all(isinstance(keyword, str) and keyword.strip() for keyword in image_keywords):
                  fail(f"social product #{index} imageKeywords must only contain non-empty strings")
              if not product.get("seoIntent"):
                  fail(f"social product #{index} is missing seoIntent")

              structured_item = json_ld_item.get("item", {})
              if not structured_item.get("keywords") or not structured_item.get("about"):
                  fail(f"social product #{index} JSON-LD is missing keywords/about metadata")

          print(f"validated {len(products)} products, SEO assets and metadata")
          PY

      - name: Verify generated JSON-LD is in sync with product JSON
        run: |
          node scripts/build-schema.mjs
          git diff --exit-code -- index.html en/index.html

      - name: Prepare deploy artifact
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path.cwd()
          artifact_dir = root / "deploy-artifact"
          static_files = [
              "index.html",
              "en/index.html",
              "robots.txt",
              "llms.txt",
              "sitemap.xml",
              "wishlist-products.json",
              "wishlist-products.en.json",
              "wishlist-content.json",
              "wishlist-content.en.json",
              "favicon.png",
              "favicon.ico",
              "favicon.svg",
              "favicon-16x16.png",
              "favicon-32x32.png",
              "favicon-48x48.png",
              "apple-touch-icon.png",
              "icon-192.png",
              "icon-512.png",
              "icon-maskable-512.png",
              "site.webmanifest",
              "site.en.webmanifest",
          ]
          static_directories = ["assets", "js", "styles"]
          forbidden_parts = {"prompts", "scripts", "data", "db"}

          if artifact_dir.exists():
              shutil.rmtree(artifact_dir)
          artifact_dir.mkdir(parents=True)

          for relative_path in static_files:
              source = root / relative_path
              target = artifact_dir / relative_path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          for relative_path in static_directories:
              shutil.copytree(root / relative_path, artifact_dir / relative_path, dirs_exist_ok=True)

          for path in artifact_dir.rglob("*"):
              relative_parts = set(path.relative_to(artifact_dir).parts)
              if relative_parts & forbidden_parts:
                  raise SystemExit(f"forbidden path in artifact: {path.relative_to(artifact_dir)}")
              if path.suffix == ".xcf":
                  raise SystemExit(f"source design file must not be deployed: {path.relative_to(artifact_dir)}")

          print(f"prepared deploy artifact at {artifact_dir}")
          PY

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-stoner-donator-static
          path: deploy-artifact/
          if-no-files-found: error

  deploy:
    name: Deploy to ALL-INKL
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/lazy-stoner-donator'

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: lazy-stoner-donator-static
          path: deploy-artifact

      - name: Verify required deploy secrets
        env:
          ALL_INKL_HOST: ${{ secrets.ALL_INKL_HOST }}
          ALL_INKL_USERNAME: ${{ secrets.ALL_INKL_USERNAME }}
          ALL_INKL_PRIVATE_KEY: ${{ secrets.ALL_INKL_PRIVATE_KEY }}
          ALL_INKL_HOST_KEY_FINGERPRINT: ${{ secrets.ALL_INKL_HOST_KEY_FINGERPRINT }}
          ALL_INKL_REMOTE_PATH: ${{ secrets.ALL_INKL_REMOTE_PATH }}
        run: |
          test -n "$ALL_INKL_HOST"
          test -n "$ALL_INKL_USERNAME"
          test -n "$ALL_INKL_PRIVATE_KEY"
          test -n "$ALL_INKL_HOST_KEY_FINGERPRINT"
          test -n "$ALL_INKL_REMOTE_PATH"

      - name: Deploy artifact via SFTP
        uses: eiserv/easySFTP@v1
        with:
          server: ${{ secrets.ALL_INKL_HOST }}
          port: ${{ secrets.ALL_INKL_PORT || '22' }}
          username: ${{ secrets.ALL_INKL_USERNAME }}
          private-key: ${{ secrets.ALL_INKL_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALL_INKL_PRIVATE_KEY_PASSPHRASE }}
          host-key-fingerprint: ${{ secrets.ALL_INKL_HOST_KEY_FINGERPRINT }}
          uploads: deploy-artifact/ => ${{ secrets.ALL_INKL_REMOTE_PATH }}
          strategy: sync

      - name: Smoke test production URL
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://lsd.cannachris.de/ > /tmp/lsd.html
          grep -q "Lazy Stoner Donator" /tmp/lsd.html
          grep -q 'hreflang="en"' /tmp/lsd.html
          curl --fail --silent --show-error --location --max-time 20 https://lsd.cannachris.de/en/ > /tmp/lsd-en.html
          grep -q "Cannachris Wishlist" /tmp/lsd-en.html
          grep -q 'hreflang="de"' /tmp/lsd-en.html
